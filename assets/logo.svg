<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Microscopy color calibration</title><desc id="desc">Three microscopes record different colors. Calibration connects each image to consistent spectral reference colors.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f7fa"/><stop offset="1" stop-color="#fff8ed"/></linearGradient>
  <linearGradient id="rainbow"><stop stop-color="#4655aa"/><stop offset=".3" stop-color="#1c9cb2"/><stop offset=".55" stop-color="#77b97e"/><stop offset=".75" stop-color="#dfb950"/><stop offset="1" stop-color="#cc655f"/></linearGradient>
  <g id="scope" fill="none" stroke="#28495a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-25 24h60M-15 24v-9h41M18 14C55 6 48-38 20-40M7-48l17 17M-3-42l17 17M-9-48l12-11 9 10-12 11zM-12-12h37M-8-5l-6 17"/>
    <circle cx="25" cy="-6" r="5" fill="#9cbdc8"/>
  </g>
  <g id="reference">
    <rect width="24" height="24" rx="5" fill="#b45c69"/><rect x="30" width="24" height="24" rx="5" fill="#746394"/><rect x="60" width="24" height="24" rx="5" fill="#e4b5a6"/>
    <rect y="30" width="24" height="24" rx="5" fill="#548a88"/><rect x="30" y="30" width="24" height="24" rx="5" fill="#c5a552"/><rect x="60" y="30" width="24" height="24" rx="5" fill="#dae2df"/>
  </g>
</defs>
